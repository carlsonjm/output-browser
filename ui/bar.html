<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Output Browser bar</title>
<style>
:root{
  --surface:#141414; --chrome:#1c1c1c; --raised:#242424; --divider:#333333; --edge:#5a5a5a;
  --ghost:#f8f8ff; --sec:rgba(255,255,255,.66); --hint:rgba(255,255,255,.53);
  --subtle:rgba(255,255,255,.075); --hover:rgba(255,255,255,.125); --sel:rgba(255,255,255,.24);
  --body:"Inter",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{margin:0;height:100%;overflow:hidden;background:var(--chrome);color:var(--ghost);font-family:var(--body);user-select:none;cursor:default}

/* the row */
.nav{height:44px;background:var(--chrome);display:flex;align-items:center;gap:6px;padding:0 8px}
.ib{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--ghost);flex:none}
.ib:hover{background:var(--subtle)}
.ib.dim{color:rgba(255,255,255,.35)}
.ib.dim:hover{background:none}
.ib.hot,.ib.hot:hover{background:var(--hover)}
.ib svg{width:16px;height:16px}
.addr{flex:1;min-width:0;height:32px;border-radius:16px;background:var(--raised);display:flex;align-items:center;gap:8px;padding:0 14px;font-size:13px;color:var(--sec);cursor:text}
.addr b{color:var(--ghost);font-weight:500}
.addr .lock{width:12px;height:12px;color:var(--sec);flex:none}
.addr .ph{color:var(--hint)}
.addr #disp{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.addr input{display:none;flex:1;min-width:0;height:100%;border:0;outline:0;background:transparent;padding:0;font:13px var(--body);color:var(--ghost)}
.addr input::placeholder{color:var(--hint)}
.addr input::selection{background:rgba(255,255,255,.3)}
.addr.edit #disp,.addr.edit .lock{display:none}
.addr.edit input{display:block}
.fold{height:32px;padding:0 10px 0 8px;border-radius:16px;display:flex;align-items:center;gap:6px;color:var(--ghost);font-size:12px;font-weight:600;flex:none}
.fold:hover{background:var(--subtle)}
.fold.open,.fold.open:hover{background:var(--sel)}
.fold .stackico{width:18px;height:14px;position:relative}
.fold .stackico i{position:absolute;inset:0;border:1.5px solid var(--ghost);border-radius:3px;background:var(--chrome)}
.fold .stackico i:nth-child(1){transform:translate(-3px,3px);opacity:.5}
.fold .stackico i:nth-child(2){transform:translate(-1.5px,1.5px);opacity:.75}

/* the tab strip, folded out on the window's own chrome */
.strip{height:40px;display:none;align-items:center;gap:6px;padding:0 8px 8px;overflow-x:auto;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
body.folded .strip{display:flex}
.st{height:30px;max-width:210px;min-width:0;border-radius:10px;background:rgba(255,255,255,.06);display:flex;align-items:center;gap:7px;padding:0 8px 0 10px;font-size:12px;color:var(--sec);flex:0 1 auto}
.st.tab{min-width:56px}
.st span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.st b{font-weight:400;color:var(--hint);margin-left:auto;padding-left:4px}
.st b:hover{color:var(--ghost)}
.st.cur{background:#141414;color:var(--ghost)}
.st.add{width:30px;padding:0;justify-content:center;font-size:16px;color:var(--ghost);flex:none}
.fav{width:12px;height:12px;border-radius:3px;flex:none;object-fit:contain}
i.fav{background:var(--edge)}
</style>
</head>
<body>
<div class="nav">
  <div class="ib" id="back" title="Back"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M10 3 5 8l5 5"/></svg></div>
  <div class="ib" id="fwd" title="Forward"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="m6 3 5 5-5 5"/></svg></div>
  <div class="ib" id="reload" title="Reload"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M13 8a5 5 0 1 1-1.5-3.6M13 2.5v3h-3"/></svg></div>
  <div class="addr" id="addr"><svg class="lock" id="lock" viewBox="0 0 12 12" fill="currentColor"><rect x="2" y="5" width="8" height="6" rx="1.5"/><path d="M4 5V3.5a2 2 0 0 1 4 0V5" fill="none" stroke="currentColor" stroke-width="1.3"/></svg><span id="disp"></span><input id="inp" spellcheck="false" autocomplete="off" placeholder="Search or type an address"></div>
  <div class="ib" id="star" title="Bookmark"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="m8 2 1.8 3.8 4 .5-3 2.8.8 4L8 11.2 4.4 13l.8-4-3-2.8 4-.5z"/></svg></div>
  <div class="fold" id="fold" title="Tabs"><div class="stackico"><i></i><i></i><i></i></div><span id="cnt">1</span></div>
  <div class="ib" id="more" title="Menu"><svg viewBox="0 0 16 16" fill="currentColor"><circle cx="3" cy="8" r="1.4"/><circle cx="8" cy="8" r="1.4"/><circle cx="13" cy="8" r="1.4"/></svg></div>
</div>
<div class="strip" id="strip"></div>
<script>
const $=id=>document.getElementById(id);
const send=o=>console.log('ob:'+JSON.stringify(o));
let S={tabs:[],url:'',start:true,back:false,fwd:false,fold:false,menu:false};

// What the box does with typed text: an address opens, anything else is searched.
function toUrl(t){
  t=t.trim(); if(!t) return null;
  if(/^[a-z][a-z0-9+.-]*:\/\//i.test(t)||/^(about|chrome|data|view-source):/i.test(t)) return t;
  if(!/\s/.test(t)&&(/^[^\s\/:]+\.[a-z]{2,}(:\d+)?([\/?#].*)?$/i.test(t)||/^localhost(:\d+)?([\/?#].*)?$/i.test(t)||/^\d{1,3}(\.\d{1,3}){3}(:\d+)?([\/?#].*)?$/.test(t))) return 'https://'+t;
  return 'https://duckduckgo.com/?q='+encodeURIComponent(t);
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function showAddress(){
  const lock=$('lock'),d=$('disp');
  if(S.start){lock.style.display='none';d.innerHTML='<span class="ph">Search or type an address</span>';return}
  let u; try{u=new URL(S.url)}catch(e){u=null}
  if(u&&(u.protocol==='https:'||u.protocol==='http:')){
    lock.style.display=u.protocol==='https:'?'':'none';
    const rest=(u.pathname==='/'?'':u.pathname)+u.search+u.hash;
    d.innerHTML='<b>'+esc(u.host)+'</b>'+esc(rest);
  }else if(u&&u.protocol==='chrome:'){
    lock.style.display='none';d.innerHTML='<b>'+esc(u.host)+'</b>';
  }else{lock.style.display='none';d.textContent=S.url}
}

function showTabs(){
  const s=$('strip');
  s.innerHTML=S.tabs.map(t=>'<div class="st tab'+(t.cur?' cur':'')+'" data-id="'+t.id+'" title="'+esc(t.t)+'">'+
    (t.f?'<img class="fav" src="'+esc(t.f)+'" onerror="this.outerHTML=\'<i class=fav></i>\'">':'<i class="fav"></i>')+
    '<span>'+esc(t.t||'New tab')+'</span><b data-close="'+t.id+'">×</b></div>').join('')+
    '<div class="st add" id="add" title="New tab">+</div>';
  $('cnt').textContent=S.tabs.length;
  const cur=s.querySelector('.cur'); if(cur&&S.fold) cur.scrollIntoView({block:'nearest',inline:'nearest'});
}

window.ob={
  set(o){
    Object.assign(S,o);
    document.body.classList.toggle('folded',!!S.fold);
    $('fold').classList.toggle('open',!!S.fold);
    $('more').classList.toggle('hot',!!S.menu);
    $('back').classList.toggle('dim',!S.back);
    $('fwd').classList.toggle('dim',!S.fwd);
    $('reload').classList.toggle('dim',!!S.start);
    if(!$('addr').classList.contains('edit')) showAddress();
    showTabs();
  },
  focusAddress(){edit()}
};

function edit(){
  const a=$('addr'),i=$('inp');
  a.classList.add('edit');
  i.value=S.start?'':S.url;
  i.focus(); i.select();
}
function stopEdit(){$('addr').classList.remove('edit');showAddress()}

$('addr').addEventListener('mousedown',e=>{if(!$('addr').classList.contains('edit')){e.preventDefault();edit()}});
$('inp').addEventListener('keydown',e=>{
  if(e.key==='Enter'){const u=toUrl($('inp').value);if(u){send({c:'go',url:u});$('inp').blur()}}
  else if(e.key==='Escape'){$('inp').blur();send({c:'focuspage'})}
});
$('inp').addEventListener('blur',stopEdit);

$('back').onclick=()=>S.back&&send({c:'back'});
$('fwd').onclick=()=>S.fwd&&send({c:'fwd'});
$('reload').onclick=()=>!S.start&&send({c:'reload'});
$('star').onclick=()=>send({c:'star'});
$('fold').onclick=()=>send({c:'fold'});
$('more').onclick=()=>send({c:'menu'});
$('strip').addEventListener('click',e=>{
  const x=e.target.closest('[data-close]'); if(x){send({c:'close',id:+x.dataset.close});return}
  if(e.target.closest('#add')){send({c:'newtab'});return}
  const t=e.target.closest('.tab'); if(t) send({c:'tab',id:+t.dataset.id});
});
$('strip').addEventListener('auxclick',e=>{
  const t=e.target.closest('.tab'); if(t&&e.button===1) send({c:'close',id:+t.dataset.id});
});
$('strip').addEventListener('wheel',e=>{if(e.deltaY){$('strip').scrollLeft+=e.deltaY;e.preventDefault()}},{passive:false});
document.addEventListener('contextmenu',e=>{if(e.target.id!=='inp')e.preventDefault()});
addEventListener('DOMContentLoaded',()=>{showAddress();send({c:'ready'})});
</script>
</body>
</html>
