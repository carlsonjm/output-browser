<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Output Browser menu</title>
<style>
:root{
  --raised:#242424; --divider:#333333; --ghost:#f8f8ff; --hint:rgba(255,255,255,.53);
  --hover:rgba(255,255,255,.125); --body:"Inter",system-ui,sans-serif; color-scheme:dark;
}
html,body{margin:0;background:#1a1a1a;overflow:hidden;font-family:var(--body);color:var(--ghost);user-select:none;cursor:default}
/* The menu fills its own small window, so its edge is the window's edge. */
.menu{width:280px;background:#1a1a1a;border:1px solid var(--divider);padding:6px;display:grid;gap:1px}
.mrow{height:32px;border-radius:10px;display:flex;align-items:center;gap:8px;padding:0 10px;font-size:13px;color:var(--ghost)}
.mrow:hover{background:var(--hover)}
.mrow span{display:flex;align-items:center;gap:8px}
.mrow kbd{margin-left:auto;font:11px var(--body);color:var(--hint)}
.mrow em{margin-left:auto;font-style:normal;color:var(--hint);font-size:12px}
.mrow.dim span{color:var(--hint)}
.mrow.dim:hover,.mrow.zoom:hover{background:transparent}
.msep{height:1px;background:var(--divider);margin:4px 8px}
.zp{margin-left:auto;display:flex;align-items:center;gap:2px}
.zp i{width:26px;height:24px;border-radius:12px;background:var(--raised);display:grid;place-items:center;font-style:normal}
.zp i:hover{background:#2e2e2e}
/* the extensions list, under the extensions button in the address bar */
#x{width:300px}
.mhd{font-size:12px;color:rgba(255,255,255,.66);padding:8px 10px 6px}
.mrow.xr{height:42px}
.mrow.xr span{display:grid;gap:1px;flex:1;min-width:0}
.mrow.xr span b{font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow.xr small{font-size:11px;color:var(--hint)}
.ex{width:18px;height:18px;border-radius:5px;display:grid;place-items:center;font-style:normal;font-size:10px;font-weight:700;color:#fff;flex:none;object-fit:contain}
i.ex{background:#5a5a5a}
.pin{font-style:normal;font-size:11px;height:22px;padding:0 9px;border-radius:11px;display:grid;place-items:center;background:var(--raised);color:rgba(255,255,255,.66);flex:none}
.pin:hover{background:#2e2e2e}
.pin.on{background:rgba(255,255,255,.24);color:var(--ghost)}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="menu" id="m">
  <div class="mrow" data-c="newtab"><span>New tab</span><kbd>Ctrl T</kbd></div>
  <div class="mrow" data-c="private"><span>New private window</span><kbd>Ctrl Shift N</kbd></div>
  <div class="msep"></div>
  <div class="mrow" data-c="find"><span>Find on page</span><kbd>Ctrl F</kbd></div>
  <div class="mrow zoom"><span>Zoom</span><div class="zp"><i data-c="zoomout">−</i><b id="z">100%</b><i data-c="zoomin">+</i></div></div>
  <div class="mrow dim"><span>Reader view</span></div>
  <div class="msep"></div>
  <div class="mrow dim"><span>Add this tab to a group</span><em>›</em></div>
  <div class="mrow dim"><span>Make this tab a Card</span></div>
  <div class="msep"></div>
  <div class="mrow" data-c="history"><span>History</span><kbd>Ctrl H</kbd></div>
  <div class="mrow" data-c="bookmarks"><span>Bookmarks and pinned sites</span></div>
  <div class="mrow" data-c="downloads"><span>Downloads</span></div>
  <div class="msep"></div>
  <div class="mrow" data-c="settings"><span>Browser settings</span></div>
</div>
<div class="menu" id="x" hidden>
  <div class="mhd">Extensions on this page</div>
  <div id="xl" style="display:grid;gap:1px"></div>
  <div class="msep"></div>
  <div class="mrow" data-c="extmanage"><span>Manage extensions</span><em>Settings ›</em></div>
</div>
<script>
const send=o=>console.log('ob:'+JSON.stringify(o));
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let mode='main',exts=[];
function extRows(){
  if(!exts.length) return '<div class="mrow xr" data-c="extget"><i class="ex">+</i><span><b>Get extensions</b><small>From the Chrome Web Store</small></span></div>';
  return exts.map(e=>{
    const l=esc((e.n||'?').trim().charAt(0).toUpperCase());
    const icon=e.i?'<img class="ex" src="'+esc(e.i)+'" alt="" data-l="'+l+'">':'<i class="ex">'+l+'</i>';
    return '<div class="mrow xr"'+(e.p?' data-pop="'+esc(e.id)+'"':'')+'>'+icon+
      '<span><b>'+esc(e.n)+'</b>'+(e.p?'':'<small>Works on its own</small>')+'</span>'+
      '<i class="pin'+(e.s?' on':'')+'" data-show="'+esc(e.id)+'" data-on="'+(e.s?1:0)+'">'+(e.s?'Shown':'Show')+'</i></div>';
  }).join('');
}
function size(){
  const m=$(mode==='ext'?'x':'m');
  send({c:'menusize',w:m.offsetWidth,h:m.offsetHeight});
}
window.ob={set(o){
  if('zoom' in o)$('z').textContent=o.zoom+'%';
  if('exts' in o)exts=o.exts||[];
  if('mode' in o)mode=o.mode;
  $('m').hidden=mode!=='main';
  $('x').hidden=mode!=='ext';
  $('xl').innerHTML=extRows();
  $('xl').querySelectorAll('img.ex').forEach(i=>i.onerror=()=>{
    const n=document.createElement('i');n.className='ex';n.textContent=i.dataset.l;i.replaceWith(n);
  });
  size();
}};
document.addEventListener('click',e=>{
  const s=e.target.closest('[data-show]');
  if(s){send({c:'extshow',id:s.dataset.show,on:s.dataset.on!=='1'});return}
  const p=e.target.closest('[data-pop]');
  if(p){send({c:'extpop',id:p.dataset.pop});return}
  const t=e.target.closest('[data-c]'); if(t) send({c:t.dataset.c});
});
addEventListener('keydown',e=>{if(e.key==='Escape')send({c:'menuclose'})});
addEventListener('blur',()=>send({c:'menuclose'}));
document.addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('DOMContentLoaded',()=>{
  size();
  send({c:'menuready'});
});
</script>
</body>
</html>
